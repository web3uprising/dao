name: Solidity CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        working-directory: dao/dao-project
        run: forge install

      - name: Build
        working-directory: dao/dao-project
        run: forge build
        
      - name: Run tests
        working-directory: dao-project
        run: forge test
